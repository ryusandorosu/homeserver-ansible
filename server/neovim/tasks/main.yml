- set_fact:
    initial_nvim_install: false
  tags: [vars]

- name: Load variables
  include_vars: "{{ item }}"
  with_fileglob:
    - defaults/*.yml
  tags: [vars]

- name: Install neovim AppImage from git repo
  get_url:
    url: https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.appimage
    dest: "{{ neovim }}"
    mode: '0777'

# - debug:
#     msg: "{{ query('community.general.filetree', role_path + '/files') }}"

- name: Ensure directory structure exists
  file:
    path: "{{ homedir }}/{{ nvimdir.config }}/{{ item.path }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "{{ item.mode }}"
  loop: "{{ query('community.general.filetree', role_path + '/files') }}"
  when: item.state == 'directory'
  loop_control:
    label: "{{ item.path }}"

- name: Ensure required root directories exist
  file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: directory
  loop:
    - "{{ nvimdir.share | dirname }}"

- name: Deploy static files
  copy:
    src: "{{ item.src }}"
    dest: "{{ homedir }}/{{ nvimdir.config }}/{{ item.path }}"
    mode: "{{ item.mode }}"
  loop: "{{ query('community.general.filetree', role_path + '/files') }}"
  when: item.state == 'file'
  loop_control:
    label: "{{ item.path }}"

- name: Deploy templated files
  template:
    src: "{{ item.src }}"
    dest: "{{ homedir }}/{{ nvimdir.config }}/{{ item.path | regex_replace('.j2', '') }}"
    mode: "{{ item.mode }}"
  loop: "{{ query('community.general.filetree', role_path + '/templates') }}"
  when: item.state == 'file'
  loop_control:
    label: "{{ item.path }}"

- import_tasks: managers.yml
  when: initial_nvim_install

- name: Create root symlink for nvim configs
  file:
    src: "{{ homedir }}/{{ nvimdir.config }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ nvimdir.config }}"
    state: link

- name: Create root symlink for nvim shares
  file:
    src: "{{ homedir }}/{{ nvimdir.share }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ nvimdir.share }}"
    state: link

