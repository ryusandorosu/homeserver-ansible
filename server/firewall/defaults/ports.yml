firewall_tcp_ports:
  - "{{ sshd_port }}"
  - "{{ http_port }}"
  - "{{ https_port }}"

firewall_udp_ports:
  - "{{ local_port.wireguard }}"

firewall_lan_tcp_ports:
  - "{{ smb_netbios_tcp_port }}"
  - "{{ smb_port }}"
  - "{{ local_port.cockpit }}"
  - "{{ lan_port.synology_dsm }}"
  - "{{ syslog_port }}"
  - "{{ dns_port }}"
  - "{{ dns_tls_port }}"
  - "{{ ssdp_port }}"
  - "{{ https_port }}"

firewall_lan_udp_ports:
  - "{{ dhcp_request_port }}"
  - "{{ dhcp_resolve_port }}"
  - "{{ smb_netbios_udp_ns_port }}"
  - "{{ smb_netbios_udp_dg_port }}"
  - "{{ syslog_port }}"
  - "{{ dns_port }}"

monitoring_exporter_ports:
  - "{{ docker.monitoring.wireguard.port }}"
  - "{{ docker.monitoring.snmp.port }}"

firewall_lan_subnets:
  - "{{ home_network }}"
  - 224.0.0.1
  - 255.255.255.255
