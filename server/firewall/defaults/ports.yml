### reminder. list items need to be mapped to int when they consist of template var dictionary items, to be compared correctly. without that they are strings.
### otherwise when simple variables are referenced in list they stay ints

firewall_tcp_ports:
  - "{{ const_port.sshd }}"
  - "{{ const_port.http }}"
  - "{{ const_port.https }}"

firewall_udp_ports:
  - "{{ local_port.wireguard }}"

firewall_lan_tcp_ports:
  - "{{ const_port.smb.netbios.tcp }}"
  - "{{ const_port.smb.port }}"
  - "{{ local_port.cockpit }}"
  - "{{ lan_port.synology_dsm }}"
  - "{{ const_port.syslog }}"
  - "{{ const_port.dns }}"
  - "{{ const_port.dns_tls }}"
  - "{{ const_port.ssdp }}"
  - "{{ const_port.https }}"

firewall_lan_udp_ports:
  - "{{ const_port.dhcp.request }}"
  - "{{ const_port.dhcp.resolve }}"
  - "{{ const_port.smb.netbios.udp_ns }}"
  - "{{ const_port.smb.netbios.udp_dg }}"
  - "{{ const_port.syslog }}"
  - "{{ const_port.dns }}"

monitoring_exporter_ports:
  - "{{ docker.monitoring.wireguard.port }}"
  - "{{ docker.monitoring.snmp.port }}"

firewall_lan_subnets:
  - "{{ home_network }}"
  - 224.0.0.1
  - 255.255.255.255
