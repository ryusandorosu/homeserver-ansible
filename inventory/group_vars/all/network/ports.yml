local_port:
  wireguard: 51820
  cockpit: 9090
  wifi_ap: 8082
  appsec: 7422

lan_port:
  synology_dsm: 5001
  termux: 8022


docker:
  mihomo:
    name: mihomo
    mixed_port: 7890 #http and socks5
    socks5_port: 7891
    web_port: 9092

  mihomo_dashboard:
    name: "{{ mihomo_interface.name }}"
    port: "{{ mihomo_interface.port }}"
  wireguard_dashboard:
    name: wg_dashboard
    port: 10086

  nginx_auth:
    name: "{{ nginx_authentication.name }}"
    port: "{{ nginx_authentication.port }}"

  # monitoring
  promtail:
    name: promtail
    port: 9080
  loki:
    name: loki
    port: 3100
  grafana:
    name: grafana
    port: 3000
  privoxy:
    name: privoxy
    port: 8118 #http_proxy_port
  prometheus:
    name: prometheus
    port: 9091 #9090

  monitoring:
    node:
      name: node_exporter
      port: 9100
    wireguard:
      name: wg_exporter
      port: 9586
    fail2ban:
      name: f2b_exporter
      port: 9191
    cadvisor:
      name: cadvisor
      port: 8080
    smartctl:
      name: smartctl_exporter
      port: 9633
    snmp:
      name: snmp_exporter
      port: 9116
    blackbox:
      name: blackbox_exporter
      port: 9115
    nginx:
      name: nginx_exporter
      port: 9113

  # guacamole network
  guacd:
    name: guacd
  postgres:
    name: postgres
  guacamole:
    name: guacamole
    port: 8085 #8080

  ### non-infra:
  actual:
    name: actual
    port: 5006
  vdf:
    name: vdf
    port: 8888 #8080

### docker dictionary ends here ###
