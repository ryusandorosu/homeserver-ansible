systemd_services: /etc/systemd/system

system_logs:
  sshd: /var/log/auth.log
  fail2ban: /var/log/fail2ban.log
  kernel: /var/log/kern.log
  auditd: /var/log/audit/audit.log

brew:
  bin: /home/linuxbrew/.linuxbrew/bin
  sbin: /home/linuxbrew/.linuxbrew/sbin
default_pathenv:
  - /usr/local/sbin
  - /usr/local/bin
  - /usr/sbin
  - /usr/bin
  - /sbin
  - /bin

vimplugins: .vim/pack/plugins/start
