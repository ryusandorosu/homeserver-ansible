- name: Load all defaults recursively
  include_vars:
    dir: "{{ role_path }}/defaults"
    extensions: ["yml"]
  tags: [vars]

- name: Install additional server packages
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - w3m

- name: Locate updatedb settings
  template:
    src: plocatedb.conf.j2
    dest: /etc/updatedb.conf
    mode: '0644'
  notify: update db

- name: Remove mail from motd
  file:
    path: "/var/mail/{{ user }}"
    state: absent
