### wsl
- name: Create custom VSCode tasks directory in HOME workspace
  file:
    path: "{{ homedir }}/.vscode"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0755'

- name: Deploy VSCode task enabling 'tools/j2render.sh'
  template:
    src: tasks.json.j2
    dest: "{{ homedir }}/.vscode/tasks.json"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: '0644'

### windows (delegated)
- name: Resolve current Windows host alias
  set_fact:
    windows_target_host: >-
      {{
        groups['windows']
        | select('match', '^local-')
        | map('extract', hostvars)
        | selectattr('wsl_hostname', 'defined')
        | selectattr('wsl_hostname', 'equalto', ansible_hostname)
        | map(attribute='inventory_hostname')
        | first
      }}

- set_fact:
    whost_AppData: "{{ hostvars[windows_target_host].ansible_facts.env.APPDATA }}"

## imported from windows roles
- name: Read remote keybindings before deploy
  ansible.windows.slurp:
    path: "{{ whost_AppData }}\\Code\\User\\keybindings.json"
  delegate_to: "{{ windows_target_host }}"
  register: before_keybind
  ignore_errors: true

- name: Render repo keybindings
  set_fact:
    rendered_keybind: "{{ lookup('file', 'files/keybindings.json') }}"

- name: Show config unified diff 
  delegate_to: localhost
  vars:
    before: "{{ before_keybind.content | b64decode }}"
    after: "{{ rendered_keybind }}"
  shell: |
    {{ lookup('template', inventory_dir ~ '/../windows/templates/pyshell.sh.j2') }}
  ignore_errors: true
## /imported from windows roles

- name: Deploy VSCode task keybinding to run 'tools/j2render.sh'
  win_copy:
    src: keybindings.json
    dest: "{{ whost_AppData }}\\Code\\User\\keybindings.json"
  delegate_to: "{{ windows_target_host }}"
